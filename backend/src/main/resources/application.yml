spring:
  application:
    name: procureai-api
  config:
    # Optional, gitignored KEY=value file (e.g. GEMINI_API_KEY=...) in the repo root or backend/.
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  datasource:
    url: jdbc:h2:mem:procureai;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: false
      path: /h2-console
procureai:
  agent:
    gemini-api-key: ${GEMINI_API_KEY:}
    # gemini-3.8-flash returned 503 "high demand" / exceeded 60s during local testing on 2026-11-12;
    # gemini-3.5-flash answered in ~2s. Override with GEMINI_MODEL.
    model: ${GEMINI_MODEL:gemini-3.5-flash}
    # Per-attempt timeout; transient failures (timeout/429/5xx) are retried up to max-model-attempts times.
    request-timeout: ${GEMINI_REQUEST_TIMEOUT:PT45S}
    max-model-attempts: ${GEMINI_MAX_ATTEMPTS:3}
    # Free-tier quotas are per model (20 requests/day): continue on these when the primary is exhausted.
    fallback-models: ${GEMINI_FALLBACK_MODELS:gemini-3.5-flash-lite,gemini-3.1-flash-lite}
    max-interaction-rounds: 8
    max-tool-executions: 16
    max-repeated-identical-tool-calls: 2
  investigation:
    inventory-freshness-threshold: PT24H
    forecast-freshness-threshold: P3D
    storage-freshness-threshold: P7D
    forecast-selection-policy: LATEST_COMPLETE_RUN_FALLBACK_TO_LATEST_AVAILABLE_FOR_GAP_REPORTING
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
server:
  # Hosting platforms such as Render inject PORT.
  port: ${PORT:8080}
